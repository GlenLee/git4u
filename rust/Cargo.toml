[workspace]
resolver = "2"
members = [
  "crates/g4u-model",
  "crates/g4u-core",
  "crates/g4u-cred",
  "crates/g4u-ops",
  "crates/g4u-server",
  "../app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Git4U"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
